steps:
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Building commit: $(git rev-parse HEAD)"
        npm run build
        echo "=== out/ directory after build ==="
        ls -la /workspace/out/
        echo "=== checkout page chunk check ==="
        grep -rl "Total payable" /workspace/out/_next/static/chunks/ || echo "WARNING: Total payable not found in chunks"
    env:
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Syncing to GCS..."
        gcloud storage rsync -r --delete-unmatched-destination-objects /workspace/out gs://parkos.space
        echo "Done. Verifying checkout chunk in bucket:"
        gsutil ls gs://parkos.space/_next/static/chunks/ | grep -v "^$" | wc -l

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud storage buckets update gs://parkos.space \
          --web-main-page-suffix=index.html \
          --web-error-page=404.html
        gcloud storage buckets add-iam-policy-binding gs://parkos.space \
          --member=allUsers \
          --role=roles/storage.objectViewer
        gsutil -m setmeta -h "Cache-Control:no-cache,no-store,must-revalidate" \
          $(gsutil ls -r "gs://parkos.space/**.html" 2>/dev/null | tr '\n' ' ') || true
        gsutil -m setmeta -h "Cache-Control:public,max-age=31536000,immutable" \
          $(gsutil ls -r "gs://parkos.space/_next/static/**" 2>/dev/null | tr '\n' ' ') || true

options:
  logging: CLOUD_LOGGING_ONLY
