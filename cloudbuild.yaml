steps:
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  - name: 'node:20'
    entrypoint: bash
    env:
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
    args:
      - '-c'
      - |
        echo "Building with API URL: $$NEXT_PUBLIC_API_URL"
        npm run build

  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - './out'
      - 'gs://www.zeenatartofkutch.com'

  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: bash
    args:
      - '-c'
      - |
        gsutil web set -m index.html -e 404.html gs://www.zeenatartofkutch.com

        gsutil iam ch allUsers:objectViewer gs://www.zeenatartofkutch.com

        gsutil -m setmeta -h "Cache-Control:public,max-age=31536000,immutable" \
          gs://www.zeenatartofkutch.com/_next/static/**

        gsutil setmeta -h "Cache-Control:no-cache,no-store,must-revalidate" \
          gs://www.zeenatartofkutch.com/index.html

options:
  logging: CLOUD_LOGGING_ONLY