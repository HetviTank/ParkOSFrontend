steps:
  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm cache clean --force
        npm ci

  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Commit: $(git rev-parse HEAD)"
        echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
        npm run build
        echo "=== Verifying out/ ==="
        ls /workspace/out/dashboard/check-out/
        echo "=== Checkout chunk with new code ==="
        grep -rl "Total payable" /workspace/out/_next/static/chunks/
        echo "=== Confirming input exists ==="
        grep -rl "edit to override" /workspace/out/_next/static/chunks/
    env:
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Deleting ALL existing bucket contents first ==="
        gsutil -m rm -r gs://parkos.space/** || true
        echo "=== Uploading fresh build ==="
        gsutil -m cp -r /workspace/out/** gs://parkos.space/
        echo "=== Upload complete. Chunk count: ==="
        gsutil ls gs://parkos.space/_next/static/chunks/ | wc -l

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud storage buckets update gs://parkos.space \
          --web-main-page-suffix=index.html \
          --web-error-page=404.html
        gcloud storage buckets add-iam-policy-binding gs://parkos.space \
          --member=allUsers \
          --role=roles/storage.objectViewer
        gsutil -m setmeta -h "Cache-Control:no-cache,no-store,must-revalidate" \
          $(gsutil ls -r "gs://parkos.space/**.html" 2>/dev/null | tr '\n' ' ') || true
        gsutil -m setmeta -h "Cache-Control:public,max-age=31536000,immutable" \
          $(gsutil ls -r "gs://parkos.space/_next/static/**" 2>/dev/null | tr '\n' ' ') || true

options:
  logging: CLOUD_LOGGING_ONLY
