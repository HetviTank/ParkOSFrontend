steps:
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Starting build for API: $NEXT_PUBLIC_API_BASE_URL"
        npm run build
    env:
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'

  # 1. Sync built files to your parkos.space bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud storage rsync -r --delete-unmatched-destination-objects ./out gs://parkos.space

  # 2. Configure bucket website pages, permissions, and cache headers
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Set main page and 404 page
        gcloud storage buckets update gs://parkos.space --web-main-page-suffix=index.html --web-error-page=404.html

        # Make objects publicly readable
        gcloud storage buckets add-iam-policy-binding gs://parkos.space --member=allUsers --role=roles/storage.objectViewer

        # Set cache controls
        gcloud storage objects update "gs://parkos.space/_next/**" --cache-control="public,max-age=31536000,immutable" || true
        gcloud storage objects update "gs://parkos.space/**/*.html" --cache-control="no-cache,no-store,must-revalidate" || true

options:
  logging: CLOUD_LOGGING_ONLY